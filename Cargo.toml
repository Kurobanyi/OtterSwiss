[package]
name = "otter_swiss"
version = "3.5.1"
edition = "2024"
rust-version = "1.93"
description = "OtterSwiss — Suite portable de optimización y utilidades nativas para Windows"
license = "MIT"
repository = "https://github.com/Kurobanyi/OtterSwiss"
readme = "README.md"
publish = false

[lib]
name = "otter_swiss"
path = "src/lib.rs"

[[bin]]
name = "otter_swiss"
path = "src/main.rs"
# El binario exige administrador (manifiesto); sus tests viven en la librería.
test = false

[dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SEC-27: sevenz-rust 0.6 quedó sin mantenimiento (RUSTSEC-2026-0245/0246); sevenz-rust2 exige Rust 1.93.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "util"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync"] }
winreg = "0.52"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
dioxus = { version = "0.7", features = ["desktop"] }
# ERR-13: ya llega por dioxus-desktop; se declara para preguntar al cargador de WebView2 si el runtime funciona
# antes de abrir la ventana (misma versión que fija Cargo.lock, sin crates nuevos).
webview2-com = "0.38"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# HE-04: las reglas de .agents/rules/rust.md, comprobadas por el compilador. El resto de clippy va con su nivel por defecto
# y `-D warnings` en el CI; `pedantic` no se activa entero porque casi todo es ruido de la FFI Win32.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
non_send_fields_in_send_ty = "warn"
redundant_clone = "warn"
